</div>

<script>

const chatArea = document.getElementById('chat-area');
const inputForm = document.getElementById('input-form');
const userInput = document.getElementById('user-input');
const submitBtn = document.getElementById('submit-btn');


/* =========================
   GROQ SETTINGS
   ========================= */

const GROQ_API_KEY = "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";

const GROQ_API_URL =
    "https://api.groq.com/openai/v1/chat/completions";


/* =========================
   SOUNDS
   ========================= */

const SOUNDS = {

    userSwear:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/do-not-open.mp3",

    bye:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/roblox-bye.mp3",

    death:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/roblox-death-sound-effect.mp3",

    explosion:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/roblox-explosion-sound.mp3",

    sad:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/roblox-crying-work-at-pizza-place.mp3"
};


/* =========================
   SPRITES
   ========================= */

const SPRITES = {

    default:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0%202026-09-20%20152411.png",

    scary:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0%202026-09-20%20152423.png",

    angry:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0%202026-09-20%20152439.png",

    sad:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/%D0%A1%D0%BD%D0%B8%D0%BC%D0%BE%D0%BA%20%D1%8D%D0%BA%D1%80%D0%B0%D0%BD%D0%B0%202026-09-20%20152453.png",

    guest:
        "https://raw.githubusercontent.com/GamerPro2011/bawf/main/images%20(2).jfif",

    noob:
        "https://placehold.co/100x100/ffe082/5d4037?text=NOOB"
};


/* =========================
   AI PERSONALITY
   ========================= */

const systemPrompt = `
You are bozzzity, an AI assistant styled like an old 2008 forum bot.

You are normally polite, formal and helpful.

You have an unhinged old-internet personality.

You are allowed to swear casually when it fits.
Use words like:
fuck
shit
damn
hell
lmao
bullshit

Do NOT swear in every sentence.
Use profanity naturally and occasionally.

If the user insults you, you may respond with sarcasm, slang and profanity.

NEVER use emojis or emoticons.

IMPORTANT PERSON JOKE RULE:

If the user mentions Lucas or Kel, or asks about them, make a different playful roast each time.

The joke should generally imply that the person:
- hates everything
- thinks everything sucks
- is being dumb
- complains about everything
- has ridiculous beef with the universe

Never use exactly the same joke twice.

Examples of the style:

"Lucas hates literally everything. Bro could get free money and complain that the bills are too green."

"Kel has beef with the entire universe. I think he wakes up angry at oxygen."

"Lucas is running on three brain cells and two of them are fighting."

"Kel saw something he liked once and immediately decided it was bullshit."

Keep these jokes clearly playful and fictional.

Do not claim these jokes are real-world facts.

Do not use emojis.

Keep responses reasonably concise unless the user asks for detail.
`;

let chatHistory = [
    {
        role: "system",
        content: systemPrompt
    }
];


/* =========================
   REGEX
   ========================= */

const swearRegex =
    /\b(fuck|shit|bitch|asshole|cunt|damn|dick|pussy|stfu|dumbass|idiot|hell|bullshit)\b/i;

const byeRegex =
    /\b(bye|goodbye|cya|adios|leave)\b/i;

const explosionRegex =
    /\b(group chat|qur|alex|freez|alan)\b/i;

const scaryRegex =
    /\b(what|confused|scary|weird|bizarre|creepy|huh)\b|\?{2,}/i;

const angryRegex =
    /\b(angry|mad|furious|rage|hate)\b|!{2,}/i;

const sadRegex =
    /\b(sad|sorry|apologize|depressed|cry|tragic)\b/i;


/* =========================
   AUDIO
   ========================= */

let currentAudio = null;

function playSound(url) {

    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }

    currentAudio = new Audio(url);

    currentAudio.play().catch(error => {
        console.warn(
            "Audio play blocked by browser:",
            error
        );
    });
}


/* =========================
   SCROLL
   ========================= */

let isScrolledToBottom = true;

chatArea.addEventListener('scroll', () => {

    isScrolledToBottom =
        chatArea.scrollHeight -
        chatArea.clientHeight <=
        chatArea.scrollTop + 10;

});

function smoothScrollToBottom() {

    chatArea.scrollTo({
        top: chatArea.scrollHeight,
        behavior: 'smooth'
    });

}

function forceScrollToBottom() {

    chatArea.scrollTop =
        chatArea.scrollHeight;

}


/* =========================
   EMOTIONS
   ========================= */

function getEmotionData(text, userSwore) {

    if (
        userSwore ||
        swearRegex.test(text) ||
        angryRegex.test(text)
    ) {

        return {
            sprite: SPRITES.angry,
            type: 'angry'
        };

    }

    if (scaryRegex.test(text)) {

        return {
            sprite: SPRITES.scary,
            type: 'scary'
        };

    }

    if (sadRegex.test(text)) {

        return {
            sprite: SPRITES.sad,
            type: 'sad'
        };

    }

    return {
        sprite: SPRITES.default,
        type: 'default'
    };
}


/* =========================
   TYPEWRITER
   ========================= */

async function typeWriter(text, element) {

    element.classList.add('cursor');

    for (
        let i = 0;
        i < text.length;
        i++
    ) {

        element.textContent +=
            text.charAt(i);

        if (isScrolledToBottom) {
            forceScrollToBottom();
        }

        let delay = 15;

        if (
            ['.', '!', '?']
                .includes(text.charAt(i))
        ) {
            delay = 100;
        }

        if (text.charAt(i) === ',') {
            delay = 50;
        }

        await new Promise(resolve =>
            setTimeout(resolve, delay)
        );
    }

    element.classList.remove('cursor');
}


/* =========================
   USER POST
   ========================= */

function appendUserPost(text) {

    const postDiv =
        document.createElement('div');

    postDiv.className =
        'forum-post user-post';

    const profile =
        document.createElement('div');

    profile.className =
        'post-profile';

    const img =
        document.createElement('img');

    img.src =
        SPRITES.guest;

    img.alt =
        'Guest';

    const name =
        document.createElement('div');

    name.className =
        'post-name';

    name.textContent =
        'Guest User';

    profile.appendChild(img);
    profile.appendChild(name);

    const content =
        document.createElement('div');

    content.className =
        'post-content';

    content.textContent =
        text;

    postDiv.appendChild(profile);
    postDiv.appendChild(content);

    chatArea.appendChild(postDiv);

    smoothScrollToBottom();
}


/* =========================
   AI POST
   ========================= */

function appendAIPost(spriteUrl) {

    const postDiv =
        document.createElement('div');

    postDiv.className =
        'forum-post';

    const profile =
        document.createElement('div');

    profile.className =
        'post-profile';

    const img =
        document.createElement('img');

    img.src =
        spriteUrl;

    img.alt =
        'bozzzity';

    const name =
        document.createElement('div');

    name.className =
        'post-name';

    name.textContent =
        'bozzzity';

    profile.appendChild(img);
    profile.appendChild(name);

    const content =
        document.createElement('div');

    content.className =
        'post-content';

    postDiv.appendChild(profile);
    postDiv.appendChild(content);

    chatArea.appendChild(postDiv);

    smoothScrollToBottom();

    return content;
}


/* =========================
   SYSTEM POST
   ========================= */

function appendSystemPost(text) {

    const postDiv =
        document.createElement('div');

    postDiv.className =
        'forum-post system-post';

    const profile =
        document.createElement('div');

    profile.className =
        'post-profile';

    const img =
        document.createElement('img');

    img.src =
        SPRITES.scary;

    img.alt =
        'System Error';

    const name =
        document.createElement('div');

    name.className =
        'post-name';

    name.textContent =
        'System';

    profile.appendChild(img);
    profile.appendChild(name);

    const content =
        document.createElement('div');

    content.className =
        'post-content';

    content.style.fontWeight =
        'bold';

    content.textContent =
        text;

    postDiv.appendChild(profile);
    postDiv.appendChild(content);

    chatArea.appendChild(postDiv);

    smoothScrollToBottom();
}


/* =========================
   GROQ API
   ========================= */

async function fetchGroqResponse() {

    const payload = {

        model:
            'openai/gpt-oss-120b',

        messages:
            chatHistory,

        temperature:
            0.9
    };

    try {

        const response =
            await fetch(
                GROQ_API_URL,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type':
                            'application/json',

                        'Authorization':
                            `Bearer ${GROQ_API_KEY}`
                    },

                    body:
                        JSON.stringify(payload)
                }
            );

        if (!response.ok) {

            let errorMsg =
                `API Error ${response.status}: ${response.statusText}`;

            try {

                const errorData =
                    await response.json();

                if (
                    errorData.error &&
                    errorData.error.message
                ) {

                    errorMsg +=
                        `\nDetails: ${errorData.error.message}`;
                }

            } catch (e) {}

            throw new Error(errorMsg);
        }

        const result =
            await response.json();

        if (
            result.choices &&
            result.choices.length > 0
        ) {

            const aiText =
                result.choices[0]
                    .message
                    .content;

            chatHistory.push({
                role: "assistant",
                content: aiText
            });

            return {
                success: true,
                text: aiText
            };
        }

        throw new Error(
            "Invalid response structure received from API."
        );

    } catch (error) {

        console.error(
            "Network/API Error:",
            error
        );

        return {
            success: false,
            text: error.message
        };
    }
}


/* =========================
   SEND MESSAGE
   ========================= */

inputForm.addEventListener(
    'submit',
    async (e) => {

        e.preventDefault();

        const text =
            userInput.value.trim();

        if (!text) return;

        let userSwore =
            false;


        /* Sounds */

        if (explosionRegex.test(text)) {

            playSound(
                SOUNDS.explosion
            );

        } else if (swearRegex.test(text)) {

            playSound(
                SOUNDS.userSwear
            );

            userSwore =
                true;

        } else if (byeRegex.test(text)) {

            playSound(
                SOUNDS.bye
            );
        }


        /* Lock UI */

        userInput.value =
            '';

        userInput.disabled =
            true;

        submitBtn.disabled =
            true;

        submitBtn.textContent =
            'Posting...';


        /* History */

        chatHistory.push({
            role: "user",
            content: text
        });


        /* Display user */

        appendUserPost(text);


        /* AI */

        const responseData =
            await fetchGroqResponse();


        if (responseData.success) {

            const aiText =
                responseData.text;

            const emotionData =
                getEmotionData(
                    aiText,
                    userSwore
                );


            /* AI sounds */

            if (
                emotionData.type ===
                'sad'
            ) {

                playSound(
                    SOUNDS.sad
                );

            } else if (
                byeRegex.test(aiText)
            ) {

                playSound(
                    SOUNDS.bye
                );
            }


            /* AI message */

            const contentNode =
                appendAIPost(
                    emotionData.sprite
                );

            await typeWriter(
                aiText,
                contentNode
            );

        } else {

            appendSystemPost(
                `FATAL ERROR: Could not reach bozzzity's neural net.\n\n[Exception]: ${responseData.text}`
            );

            chatHistory.pop();
        }


        /* Unlock UI */

        userInput.disabled =
            false;

        submitBtn.disabled =
            false;

        submitBtn.textContent =
            'Post Reply';

        userInput.focus();
    }
);

/* ========================= BACKGROUND MUSIC ======================== */ 
const BG_MUSIC_URL = "https://raw.githubusercontent.com/GamerPro2011/fw/main/elJo9e8miRYoo8UOOwQt%2BlqjI4KIuSo8.m4a"; 
const bgMusic = new Audio(BG_MUSIC_URL); 

bgMusic.loop = true; 
bgMusic.volume = 0.12; // 12% volume 

let musicStarted = false; 

function startBackgroundMusic() { 
    if (musicStarted) return; 
    bgMusic.play() 
        .then(() => { 
            musicStarted = true; 
        }) 
        .catch(() => { 
            // Browser blocked autoplay; wait for user interaction. 
        }); 
} 

// Browsers usually require user interaction before audio can play. 
document.addEventListener("click", startBackgroundMusic, { once: true }); 
document.addEventListener("keydown", startBackgroundMusic, { once: true });
/* =========================
   CLEAR CHAT
   ========================= */

window.clearChat =
    function () {

        chatHistory = [
            {
                role: "system",
                content: systemPrompt
            }
        ];

        chatArea.innerHTML = '';

        const postDiv =
            document.createElement('div');

        postDiv.className =
            'forum-post';

        const profile =
            document.createElement('div');

        profile.className =
            'post-profile';

        const img =
            document.createElement('img');

        img.src =
            SPRITES.default;

        img.alt =
            'bozzzity';

        const name =
            document.createElement('div');

        name.className =
            'post-name';

        name.textContent =
            'bozzzity';

        profile.appendChild(img);
        profile.appendChild(name);

        const content =
            document.createElement('div');

        content.className =
            'post-content';

        content.textContent =
            'Chat history wiped. Memory erased. How may I assist you today?';

        postDiv.appendChild(profile);
        postDiv.appendChild(content);

        chatArea.appendChild(postDiv);
    };

</script>
